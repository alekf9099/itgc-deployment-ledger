name: CI

# 대장 화면이 깨진 채로 운영에 반영되지 않도록, main 으로 향하는 모든 PR 에서
# index.html 정합성을 확인합니다. 이 워크플로를 브랜치 보호의 필수 통과 조건으로
# 지정하면 검사 실패 시 머지가 차단됩니다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: 정합성 검사 및 판정 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: index.html 정합성 검사
        run: node scripts/check.mjs
      # 판정 규칙과 점검 집계는 통제 결과를 결정하므로 값이 바뀌면 막습니다.
      - name: 판정 · 점검 집계 검증
        run: node scripts/test-judge.mjs
      # 시트 레이아웃은 엑셀 양식 파일의 머리글과 직접 대조합니다.
      # 양식이 개정되면 여기서 먼저 막혀 코드를 함께 고치게 됩니다.
      - name: 시트 레이아웃 검증
        run: node scripts/test-sheet.mjs
      # 세션 토큰 형식이 바뀌면 전 사용자가 로그아웃되므로 규칙을 고정합니다.
      - name: 세션 토큰 검증
        run: node scripts/test-session.mjs
      # 반출본 형식과 해시는 증적 무결성의 근거이므로 값이 바뀌면 막습니다.
      - name: 반출본 · 수식 주입 방어 검증
        run: node scripts/test-csv.mjs
      # 판정 열을 반입하게 되면 시트에서 판정을 고칠 수 있으므로 매핑을 고정합니다.
      - name: 시트 반입 매핑·검증
        run: node scripts/test-import.mjs
      # 환경변수에 키를 넣는 형태가 사람마다 달라, 어느 쪽이든 서명이 되어야 합니다.
      - name: 서비스 계정 키 정리 검증
        run: node scripts/test-pem.mjs
      - name: 서버 코드 문법 검사
        run: |
          for f in api/*.js lib/*.js; do node --check "$f"; done
