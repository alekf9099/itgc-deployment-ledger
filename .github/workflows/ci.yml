name: CI

# 대장 화면이 깨진 채로 운영에 반영되지 않도록, main 으로 향하는 모든 PR 에서
# index.html 정합성을 확인합니다. 이 워크플로를 브랜치 보호의 필수 통과 조건으로
# 지정하면 검사 실패 시 머지가 차단됩니다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: index.html 정합성 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check.mjs
